<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable — ShowRoom d'Oliv</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/show-room-oliv/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #131110; color: #ece7dd;
            font-family: 'Montserrat', Helvetica, Arial, sans-serif; font-weight: 300;
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 2rem;
        }
        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 300;
            font-size: clamp(6rem, 20vw, 12rem); line-height: 1; color: #c6a468;
        }
        p { color: #9a9289; margin: 1.6rem 0 3rem; max-width: 40ch; }
        em { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; color: #ece7dd; font-size: 1.5rem; }
        a {
            color: #c6a468; text-decoration: none; font-size: 0.74rem;
            letter-spacing: 0.24em; text-transform: uppercase;
            border-bottom: 1px solid #c6a468; padding-bottom: 0.45rem;
            transition: color 0.3s ease, border-color 0.3s ease;
        }
        a:hover { color: #ece7dd; border-color: #ece7dd; }
        .rule { width: 72px; height: 1px; background: #c6a468; margin: 2.4rem 0; }
    </style>
</head>
<body>
    <h1>404</h1>
    <p><em>Cette page s'est égarée.</em><br>Comme une pièce unique, elle n'est plus disponible — mais la boutique, elle, vous attend.</p>
    <div class="rule"></div>
    <a href="/show-room-oliv/">Retour à la boutique</a>
</body>
</html>
